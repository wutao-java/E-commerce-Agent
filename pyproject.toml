[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "e-commerce-agent"
version = "0.1.0"
description = "E-commerce Agent service"
requires-python = ">=3.11"
dependencies = [
  "asyncmy>=0.2,<1.0",
  "docling==2.127.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "onnxruntime>=1.22,<2.0",
  "pymilvus>=2.6,<2.7",
  "pydantic>=2.10,<3.0",
  "PyJWT[crypto]>=2.9,<3.0",
  "python-dotenv>=1.0,<2.0",
  "SQLAlchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1.0",
  "pytest>=8.0,<9.0",
  "reportlab>=4.0,<5.0",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
