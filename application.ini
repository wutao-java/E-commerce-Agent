# HTTP 服务和日志设置。
[server]
name = ${SERVICE_NAME:-e-commerce-agent}
host = ${SERVER_HOST:-0.0.0.0}
port = ${SERVER_PORT:-8000}
log_level = ${LOG_LEVEL:-INFO}
log_file = ${LOG_FILE:-}
start_integrations = ${START_INTEGRATIONS:-false}

# 电商业务后端的只读事实接口配置。
[ecommerce]
base_url = ${ECOMMERCE_BASE_URL:-http://127.0.0.1:8080}
# 单次业务事实查询超时时间，单位为秒。
timeout_seconds = ${ECOMMERCE_TIMEOUT_SECONDS:-5}

[llm]
api_key = ${AGENT_OPENAI_API_KEY:-}
base_url = ${AGENT_OPENAI_BASE_URL:-https://api.deepseek.com}
model = ${AGENT_OPENAI_MODEL:-deepseek-v4-pro}
classifier_model = ${AGENT_CLASSIFIER_MODEL:-deepseek-v4-pro}
timeout_seconds = ${AGENT_OPENAI_TIMEOUT_SECONDS:-30}
# 输入 token 每千个的估算费用，单位为人民币元。
input_cny_per_1k = ${AGENT_COURSE_INPUT_CNY_PER_1K:-0.001}
# 输出 token 每千个的估算费用，单位为人民币元。
output_cny_per_1k = ${AGENT_COURSE_OUTPUT_CNY_PER_1K:-0.002}

# 独立课程知识库；默认关闭，不能把课程规则用于真实商城流量。
[rag]
enabled = ${COURSE_RAG_ENABLED:-false}
embedding_api_key = ${COURSE_RAG_EMBEDDING_API_KEY:-}
embedding_base_url = ${COURSE_RAG_EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
embedding_model = ${COURSE_RAG_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-4B}
milvus_uri = ${COURSE_RAG_MILVUS_URI:-http://127.0.0.1:19530}
milvus_token = ${COURSE_RAG_MILVUS_TOKEN:-}
collection_prefix = ${COURSE_RAG_COLLECTION_PREFIX:-course_rag}
chunk_size = ${COURSE_RAG_CHUNK_SIZE:-420}
chunk_overlap = ${COURSE_RAG_CHUNK_OVERLAP:-80}
candidate_k = ${COURSE_RAG_CANDIDATE_K:-20}
top_k = ${COURSE_RAG_TOP_K:-3}
min_vector_score = ${COURSE_RAG_MIN_VECTOR_SCORE:-0.35}
low_confidence_score = ${COURSE_RAG_LOW_CONFIDENCE_SCORE:-0.62}
as_of_date = ${COURSE_RAG_AS_OF_DATE:-}
rerank_base_url = ${COURSE_RAG_RERANK_BASE_URL:-}
rerank_model = ${COURSE_RAG_RERANK_MODEL:-}
rerank_api_key = ${COURSE_RAG_RERANK_API_KEY:-}

# MySQL 连接和连接池设置。
[database]
# 数据库连接地址。
url = ${DATABASE_URL:-}
# 连接池常驻连接数。
pool_size = ${DATABASE_POOL_SIZE:-10}
# 连接池允许临时增加的最大连接数。
max_overflow = ${DATABASE_MAX_OVERFLOW:-20}
# 从连接池获取连接的最长等待时间，单位为秒。
pool_timeout = ${DATABASE_POOL_TIMEOUT:-30}
# 连接回收间隔，单位为秒。
pool_recycle = ${DATABASE_POOL_RECYCLE:-1800}
# 是否打印数据库执行的 SQL。
echo = ${DATABASE_ECHO:-false}

# Spring Boot Access JWT 验签设置。
[jwt]
# Agent 只持有 Spring Boot 对应的 RSA 公钥。
public_key = ${AUTH_JWT_PUBLIC_KEY:-}
algorithm = ${AUTH_JWT_ALGORITHM:-RS256}
issuer = ${AUTH_JWT_ISSUER:-commerce-backend}
audience = ${AUTH_JWT_AGENT_AUDIENCE:-ecommerce-agent}
required_scope = ${AUTH_JWT_REQUIRED_SCOPE:-agent:chat}
leeway_seconds = ${AUTH_JWT_LEEWAY_SECONDS:-5}
